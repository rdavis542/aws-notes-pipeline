name: "AWS Notes Pipeline Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm destruction of all resources'
        required: true
        type: string
      target_resource:
        description: 'Optional: Specific resource to destroy (leave empty for all)'
        required: false
        type: string

jobs:
  terraform:
    uses: rdavis542/aws-github-workflows/.github/workflows/tf-destroy.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      aws_region: us-east-1
      tf_vars: '{"discord_public_key":"${{ secrets.DISCORD_PUBLIC_KEY }}"}'
    secrets: inherit
